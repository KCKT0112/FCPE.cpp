name: CPU build and PyTorch parity
on: [push, pull_request, workflow_dispatch]

jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference dependencies
        if: runner.os != 'macOS'
        run: |
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements.txt
      - name: Install macOS Python reference dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r scripts/requirements.txt
      - name: Download, verify, extract and convert the model
        run: |
          python scripts/download_model.py
          python scripts/convert_fcpe.py models/torchfcpe-0.0.4-py3-none-any.whl models/fcpe-f32.gguf
          python scripts/convert_fcpe.py models/torchfcpe-0.0.4-py3-none-any.whl models/fcpe-f16.gguf --type f16
      - name: Configure
        shell: bash
        run: |
          METAL=OFF
          if [[ "$RUNNER_OS" == "macOS" ]]; then METAL=ON; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFCPE_METAL="$METAL" -DFCPE_TEST_MODEL="$PWD/models/fcpe-f32.gguf"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Model parity and file-format regressions
        shell: bash
        run: |
          CLI=build/bin/fcpe-cli
          if [[ "$RUNNER_OS" == "Windows" ]]; then CLI="$CLI.exe"; fi
          python tests/test_tools.py --cli "$CLI" --model models/fcpe-f32.gguf -v
          python scripts/validate.py --cli "$CLI" --model models/fcpe-f32.gguf
          python scripts/validate.py --cli "$CLI" --model models/fcpe-f16.gguf --type f16 --output-dir validation/f16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: validation/**/report.json
